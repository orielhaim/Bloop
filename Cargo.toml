[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/bloop-core",
  "crates/bloop-sdk",
  "plugins/now-playing",
  "plugins/volume",
  "plugins/bluetooth",
  "plugins/timer",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
wit-bindgen = { version = "0.60", default-features = false, features = ["macros"] }
