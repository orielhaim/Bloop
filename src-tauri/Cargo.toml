[package]
name = "bloop"
version.workspace = true
description = "Bloop"
edition.workspace = true
license.workspace = true

[lib]
name = "bloop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bloop-core = { path = "../crates/bloop-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tracing = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter", "ansi"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
